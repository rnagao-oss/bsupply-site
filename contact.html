<h1 class="page-title" data-split="">お問い合わせ</h1>
<p class="sec-lede">内容を確認のうえ、担当者よりご連絡いたします。</p>
</section>
<section class="section ct-section" data-sphere="on">
<form action="https://formsubmit.co/r.nagao@b--supply.com" class="ct-form" enctype="multipart/form-data" method="POST">
<input name="_subject" type="hidden" value="【B supplyサイト】お問い合わせ"/>
<input name="_captcha" type="hidden" value="false"/>
<input name="_next" type="hidden" value="https://rnagao-oss.github.io/bsupply-site/thanks.html"/>
<input name="_template" type="hidden" value="table"/>
<input name="_honey" style="display:none" type="text"/>
<fieldset class="ct-field">
<legend>お問い合わせの種別 <em>必須</em></legend>
<div class="ct-radios">
<label class="ct-radio">
<input name="お問い合わせ種別" required="" type="radio" value="コンサルティング事業"/>
<span><b>コンサルティング事業</b><small>経営のご相談・プロジェクトのご依頼</small></span>
</label>
<label class="ct-radio">
<input name="お問い合わせ種別" type="radio" value="革製造事業"/>
<span><b>革製造事業</b><small>OEMのご相談・サンプル製作・工房見学</small></span>
</label>
<label class="ct-radio">
<input name="お問い合わせ種別" type="radio" value="その他"/>
<span><b>その他</b><small>採用・事業承継・取材など</small></span>
</label>
</div>
</fieldset>
<div class="ct-grid">
<label class="ct-field">
<span>会社名</span>
<input name="会社名" placeholder="株式会社〇〇" type="text"/>
</label>
<label class="ct-field">
<span>お名前 <em>必須</em></span>
<input name="お名前" placeholder="山田 太郎" required="" type="text"/>
</label>
<label class="ct-field">
<span>メールアドレス <em>必須</em></span>
<input name="email" placeholder="you@example.com" required="" type="email"/>
</label>
<label class="ct-field">
<span>電話番号</span>
<input name="電話番号" placeholder="03-0000-0000" type="tel"/>
</label>
</div>
<label class="ct-field">
<span>お問い合わせ内容 <em>必須</em></span>
<textarea name="お問い合わせ内容" placeholder="ご相談内容をご記入ください。" required="" rows="7"></textarea>
</label>
<label class="ct-field ct-file">
<span>添付ファイル（任意）</span>
<input accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" name="attachment" type="file"/>
<small>履歴書・各種資料など（PDF・Word・画像、10MBまで）</small>
</label>
<button class="ct-submit" type="submit">送信する<em>→</em></button>
<p class="ct-note">お預かりした情報は、お問い合わせへの対応にのみ使用します。</p>
</form>
